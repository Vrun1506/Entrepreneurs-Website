<!--
  Supabase Auth → Email Templates → "Magic Link"
  Used by signInWithOtp (student sign-in / sign-up). Code-only: no link, so
  Microsoft 365 Safe Links has no URL to pre-fetch and burn.
  Suggested subject: Your Foundry sign-in code
  Variables: {{ .Token }} = the 6-digit code.
-->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#0c0c0b;margin:0;padding:32px 0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <tr>
    <td align="center">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:440px;background:#161615;border:1px solid #2a2a27;border-radius:16px;overflow:hidden;">
        <tr>
          <td style="padding:32px 36px 8px 36px;">
            <div style="font-size:13px;font-weight:600;letter-spacing:0.12em;text-transform:uppercase;color:#c9a84c;">Imperial Entrepreneurs</div>
            <div style="font-size:22px;font-weight:700;color:#ededed;margin-top:4px;">Foundry</div>
          </td>
        </tr>
        <tr>
          <td style="padding:16px 36px 0 36px;">
            <h1 style="margin:0 0 12px 0;font-size:19px;font-weight:600;color:#ededed;">Your sign-in code</h1>
            <p style="margin:0;font-size:14px;line-height:1.6;color:#9a9a95;">
              Enter this code on the sign-in page to continue. It expires in one hour.
            </p>
          </td>
        </tr>
        <tr>
          <td style="padding:24px 36px;">
            <div style="background:#0c0c0b;border:1px solid #2a2a27;border-radius:12px;padding:20px;text-align:center;font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;font-size:32px;font-weight:700;letter-spacing:0.32em;color:#c9a84c;">
              {{ .Token }}
            </div>
          </td>
        </tr>
        <tr>
          <td style="padding:0 36px 32px 36px;">
            <p style="margin:0;font-size:12px;line-height:1.6;color:#6f6f6a;">
              If you didn&rsquo;t request this, you can safely ignore this email — no one can sign in without the code.
            </p>
          </td>
        </tr>
      </table>
      <div style="max-width:440px;margin:16px auto 0 auto;font-size:11px;color:#5a5a55;text-align:center;">
        Imperial Entrepreneurs · IC Founders Ltd
      </div>
    </td>
  </tr>
</table>
