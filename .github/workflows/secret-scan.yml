name: Secret scan

# Catches credentials (Supabase service_role key, SMTP creds, API tokens) before
# they land in history. Native GitHub push-protection is the first line; this is
# defence-in-depth on PR diffs plus a weekly full-history sweep.
on:
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC — full-history sweep

permissions:
  contents: read

jobs:
  trufflehog:
    name: TruffleHog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # full history so PR-range and sweep scans both work

      - name: TruffleHog
        uses: trufflesecurity/trufflehog@main
        with:
          # --only-verified: report a finding only when the credential is live
          # (the secret is actually authenticated against its provider), which
          # all but eliminates false positives.
          extra_args: --only-verified
