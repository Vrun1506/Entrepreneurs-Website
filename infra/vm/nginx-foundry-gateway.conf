# Foundry upload gateway — origin behind Cloudflare.
#
# Public TLS terminates at Cloudflare; this certificate secures the last hop
# and is what lets the zone run in Full (strict). The NSG only admits
# Cloudflare's ranges, so nothing else should ever reach this server block.

# ─── Trust Cloudflare for the real visitor IP ──────────────────────────
# Without this, $remote_addr is Cloudflare's edge IP — the same handful of
# addresses for every visitor on earth — not the person making the request.
# Everything below (rate limiting, access logs, X-Real-IP passed to the app)
# is meaningless without this block running first.
#
# Ranges fetched from https://www.cloudflare.com/ips-v4 and /ips-v6. They
# change occasionally; re-run this alongside the NSG rule in provision.sh
# when Cloudflare publishes new ones.
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;

# ─── Flood guard ────────────────────────────────────────────────────────
# A backstop against many requests per second from one address, not a
# precision control — Imperial students share campus NAT, so anything tuned
# tighter than a genuine flood risks throttling a lecture hall instead of an
# attacker.
#
# This is what stops an unauthenticated POST flood from starving the
# gateway's two workers before the app's own ticket check ever runs — the
# ticket check is cheap, but FastAPI has already received the full body by
# the time it executes, so the request rate itself is what needs bounding
# here, not just the body size (client_max_body_size, below, handles that).
#
# rate=10r/s is the sustained ceiling and is deliberately still tight — it's
# what a script parked on the gateway indefinitely would hit, and 10
# image-processing requests/sec forever is already enough to matter to two
# workers. It's no longer numerically paired with the app's anonMutations
# ceiling (300/min) the way it once was; they're separate guards on separate
# services now, and this one is sized for the gateway's own worker count.
# burst, below, is the number that actually covers a real spike (a society
# event, a shared-NAT lecture hall all opening the app within a few
# seconds) — that's a one-time absorb, not sustained load, so it can be much
# more generous without weakening the flood guard itself.
limit_req_zone $binary_remote_addr zone=gw_flood:10m rate=10r/s;

server {
    # Combined listen+http2 form, not the newer standalone `http2 on;`
    # directive: Ubuntu 24.04 LTS ships nginx 1.24.0, and that directive
    # wasn't introduced until 1.25.1 — confirmed live via `nginx -v` on the
    # VM after `nginx -t` rejected it as an unknown directive.
    listen 443 ssl http2;
    server_name api.imperialentrepreneurs.com;

    ssl_certificate     /etc/ssl/cloudflare/origin.pem;
    ssl_certificate_key /etc/ssl/cloudflare/origin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # nginx defaults to 1m, which would reject uploads at 1MB while the
    # gateway is configured to accept 8. The extra headroom is multipart
    # overhead, not a larger allowance — the real cap is MAX_UPLOAD_BYTES,
    # enforced while streaming.
    client_max_body_size 10m;

    # Don't advertise the version in error pages or the Server header.
    server_tokens off;

    location / {
        # burst=300 nodelay: sized for a real spike — a signature society
        # event or a shared-NAT lecture hall producing a wave of
        # near-simultaneous ticket-fetch + image-PUT pairs within the same
        # second or two, not sustained flooding. Membership is 1,000+ and
        # growing (plus a large alumni base), so a packed in-person event
        # concentrated behind one building's NAT is a real, not
        # hypothetical, case. nodelay serves the whole burst immediately
        # rather than pacing it out, since it's real people waiting on a
        # response, not a queue nginx should be smoothing. Anything beyond
        # this genuinely sustained falls back to the 10r/s ceiling above.
        limit_req zone=gw_flood burst=300 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
        # Hand the body to the app as it arrives rather than spooling the
        # whole upload to disk first: the gateway enforces its size cap while
        # streaming, and buffering here would defeat that.
        proxy_request_buffering off;
    }
}

# Anything arriving on plain HTTP is not Cloudflare. Close the connection
# without a response rather than answering a scanner.
server {
    listen 80 default_server;
    server_name _;
    return 444;
}
